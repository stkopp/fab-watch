name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Audit publication source
        run: python tools/audit_publication.py
      - name: Build installer
        shell: pwsh
        run: ./build.ps1 -Python (Get-Command python).Source
      - name: Regression and package tests
        run: python -B -m unittest discover -s tests -v
      - name: Check release version and make checksums
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = python -c "import runtime; print(runtime.VERSION)"
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag/version mismatch' }
          if (!(Test-Path "docs/releases/$version.md")) { throw 'Release notes are missing' }
          Get-ChildItem dist/FabWatchSetup-*-x64.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push' && github.repository == 'stkopp/fab-watch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name windows-installer --dir dist
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Fab Watch ${RELEASE_TAG#v}" --notes-file "docs/releases/${RELEASE_TAG#v}.md" --latest
